<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spadetown</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f3f3f3;
  padding: 25px;
}
.album {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}
h1 {
  margin-bottom: 5px;
}
#trackTitle {
  margin-top: 20px;
}
audio {
  width: 100%;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="album">

<h1>SPADETOWN</h1>
<p>Charity Album</p>

<h3 id="trackTitle">01 If I Said You Had A Beautiful Body</h3>

<audio id="player" controls>
  Your browser does not support audio playback.
</audio>

</div>

<script>
const tracks = [
  {
    title: "01 If I Said You Had A Beautiful Body",
    url: "https://www.dropbox.com/scl/fi/nyuaevr1km97mfhpw4zke/01-If-I-Said-You-Had-A-Beautiful-Body.mp3?rlkey=wsuvmi7tvpijvw1t03vfsbewd&raw=1"
  },
  {
    title: "02 Little Old Wine Drinker Me",
    url: "https://www.dropbox.com/scl/fi/5hhiremq71s0h8sa6ysvg/02-Little-Old-Wine-Drinker-Me.mp3?rlkey=ggj2h3i6yl3ydzl36rd18hii2&raw=1"
  }
];

let currentTrack = 0;

const player = document.getElementById("player");
const trackTitle = document.getElementById("trackTitle");

function loadTrack(index) {
  currentTrack = index;
  player.src = tracks[index].url;
  trackTitle.textContent = tracks[index].title;
}

player.addEventListener("ended", function() {
  if (currentTrack < tracks.length - 1) {
    loadTrack(currentTrack + 1);
    player.play();
  }
});

loadTrack(0);
</script>

</body>
</html>
